<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具集 · Toolbox</title>
<style>
  :root { --accent:#2f6fed; --bg:#f5f7fa; --card:#fff; --text:#1c2333; --muted:#6b7280; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; padding:48px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.7rem; margin-bottom:4px; }
  .sub { color:var(--muted); margin-bottom:28px; font-size:.95rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { display:block; background:var(--card); border:1px solid #e5e7eb; border-radius:12px;
          padding:18px 20px; text-decoration:none; color:inherit; transition:box-shadow .15s,border-color .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 6px 18px rgba(47,111,237,.13); }
  .card h2 { font-size:1.1rem; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .card p { color:var(--muted); font-size:.86rem; }
  .tag { font-size:.7rem; font-weight:600; color:#fff; background:var(--accent); border-radius:999px;
         padding:1px 9px; letter-spacing:.5px; white-space:nowrap; }
  .tag-green { background:#16a34a; }
  footer { margin-top:36px; color:var(--muted); font-size:.8rem; }
  code { background:#eef1f5; border-radius:4px; padding:0 5px; font-size:.85em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的工具集</h1>
  <p class="sub">网页工具 &amp; 本地运行工具 · 每个工具一个卡片，点卡片进入。</p>

  <div class="grid">
    <!-- ===== EPD-eTags：由 scripts/deploy-ghpages.sh 生成到 etags/ ===== -->
    <a class="card" href="etags/">
      <h2>EPD-eTags <span class="tag">网页工具</span></h2>
      <p>墨水屏（电子纸）工具：图片传输、裁剪、OTA 固件升级等（需 Chrome，走 Web 串口/蓝牙连接本机设备）</p>
    </a>

    <!--
    ===== 以后新增工具：复制上面一张卡片，改 href 为对应目录名 =====
    <a class="card" href="tool2/">
      <h2>工具二 <span class="tag tag-green">本地工具</span></h2>
      <p>一句话描述这个工具是干什么的</p>
    </a>
    -->
  </div>

  <footer>
    本页为入口页（Hub），位于仓库根 <code>index.html</code>；
    每个工具是一个目录（如 <code>etags/</code>），静态文件直接放入并提交推送即可。
    新增工具：加一个目录 + 在此追加一张卡片。
  </footer>
</div>
</body>
</html>
